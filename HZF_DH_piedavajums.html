const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const titles={studies:'Studijas un mācības',projects:'Projekti',resources:'Resursi un rīki'};let mode=new URLSearchParams(location.search).get('sadala')||'studies';if(!titles[mode])mode='studies';
function belongs(r,m){return m==='studies'?r.type==='Studiju kurss'||(r.type==='Cita aktivitāte'&&r.layer==='education'):m==='projects'?r.type==='Projekts'||r.id==='A7':r.type==='Digitālais resurss'||Boolean(r.resourceName)||r.id==='A11';}
function eligible(r){return $('broader').checked||['research','education'].includes(r.layer);}
DATA.units.forEach(u=>{const e=document.createElement('option');e.value=e.textContent=u.name;$('unit').appendChild(e);});
function projectStatus(r){
 const state=projectState(r),label={active:'Aktīvs',ended:r.lifecycle==='Neaktīvs'?'Neaktīvs':'Beidzies',upcoming:'Plānots',unknown:'Termiņš nav norādīts'}[state];
 return `<span class="project-status ${state}" data-status="${state}" title="${r.lifecycleVerifiedOn?'Statuss precizēts '+esc(r.lifecycleVerifiedOn):'Pēc norādītā īstenošanas perioda ('+esc(DATA.date)+')'}"><i aria-hidden="true"></i>${label}</span>`;
}

function courseMeta(r){if(r.type!=='Studiju kurss')return '';return '<p class="course-meta">'+[r.courseCode?'Kods: '+esc(r.courseCode):'Kods nav norādīts',r.studyLevel?esc(r.studyLevel):''].filter(Boolean).join(' · ')+'</p>';}
function projectState(r){
 if(r.lifecycle==='Aktīvs')return 'active';
 if(r.lifecycle==='Neaktīvs'||/Noslēgts/.test(r.lifecycle||''))return 'ended';
 const parts=DATA.date.split('.'),today=parts[2]+'-'+parts[1]+'-'+parts[0];
 const dates=String(r.period||'').match(/\b\d{4}-\d{2}-\d{2}\b/g)||[];
 const years=String(r.period||'').match(/\b(?:19|20)\d{2}\b/g)||[];
 const start=dates.length>=2?dates[0]:years.length>=2?years[0]+'-01-01':'';
 const end=dates.length>=2?dates[dates.length-1]:years.length>=2?years[years.length-1]+'-12-31':'';
 if(end&&end<today)return 'ended';
 if(start&&start>today)return 'upcoming';
 if(start&&end||/Īstenošanas periodā/.test(r.lifecycle||''))return 'active';
 return 'unknown';
}
function affiliationBadge(r){if(mode!=='projects')return '';if(r.type!=='Projekts'&&r.id!=='A7')return '';const state=projectState(r),label={active:'Aktīvs projekts',ended:'Neaktīvs projekts',upcoming:'Plānots projekts',unknown:'Projekta statuss nav precizēts'}[state];return `<span class="affiliation-dot ${state}" role="img" tabindex="0" title="${label}" aria-label="${label}"></span>`;}
function card(r){const extra=r.provenance!=='Nodaļu apkopojums',url=r.url||r.sourceUrls[0];const problem=r.linkStatus&&!/^atveras$/i.test(r.linkStatus);const role=r.id==='S11'?`<p class="role"><b>Īstenotājs:</b> ${r.providerUnits.map(esc).join(' · ')}</p><p class="role"><b>Auditorija:</b> ${esc(r.audienceScope)}</p>`:`<p class="units">${r.depts.map(esc).join(' · ')}</p>`;return `<article class="offer" data-record="${r.id}">${affiliationBadge(r)}<div class="offer-top"><div class="tags">${mode==='studies'?'':extra?'<span>Papildināts no avotiem</span>':''}${r.planned?'<span>'+(mode==='projects'?'Plānots DH rezultāts':'Plānots')+'</span>':''}${!['research','education'].includes(r.layer)?'<span>'+esc(DATA.layers[r.layer])+'</span>':''}</div>${mode==='projects'?projectStatus(r):''}</div><h2>${esc(mode==='resources'&&r.resourceName?r.resourceName:r.name)}</h2>${courseMeta(r)}${role}${r.period?'<p class="period">'+esc(r.period)+'</p>':''}${r.lifecycle&&!r.lifecycle.startsWith('Aktuālā īstenošana')&&mode!=='projects'?'<p class="period">'+esc(r.lifecycle)+'</p>':''}${r.areas.length?'<p class="areas">'+r.areas.map(id=>esc(DATA.areas.find(a=>a.id===id)?.label||id)).join(' · ')+'</p>':''}${problem?'<p class="notice">'+esc(r.linkStatus)+''+'</p>':''}<div class="actions">${url?`<a href="${esc(url)}" target="_blank" rel="noopener">${mode==='resources'?(r.resourceName?'Projekta lapa':'Atvērt resursu'):'Atvērt informāciju'} ↗</a>`:''}</div><details><summary>Apraksts un avoti</summary>${r.description?'<p>'+esc(r.description)+'</p>':''}${r.linkNote?'<p>'+esc(r.linkNote)+'</p>':''}${r.availability?'<p>Pieejamība: '+esc(r.availability)+'</p>':''}${r.affiliation?'<p>'+esc(r.affiliation)+'</p>':''}<ul>${r.sourceUrls.map(u=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></li>`).join('')}</ul>${r.sourceFiles.length?'<p>'+r.sourceFiles.map(esc).join('<br>')+'</p>':''}</details></article>`;}
function render(){document.title='LU HZF · '+titles[mode];$('title').textContent=titles[mode];document.querySelectorAll('[data-mode]').forEach(a=>{const m=a.dataset.mode;a.classList.toggle('active',m===mode);$('n-'+m).textContent=DATA.records.filter(r=>belongs(r,m)&&eligible(r)).length;});const query=$('search').value.trim().toLocaleLowerCase('lv'),unit=$('unit').value;const rows=DATA.records.filter(r=>belongs(r,mode)&&eligible(r)&&(unit==='all'||r.depts.includes(unit))&&(!query||[r.name,r.reason,...r.kws,...r.depts].join(' ').toLocaleLowerCase('lv').includes(query))).sort((a,b)=>a.name.localeCompare(b.name,'lv'));$('count').textContent=rows.length+' '+(rows.length%10===1&&rows.length%100!==11?'ieraksts':'ieraksti');$('list').innerHTML=rows.length?rows.map(card).join(''):'<p class="empty">Šādai atlasei ierakstu nav.</p>';}
document.querySelectorAll('[data-mode]').forEach(a=>a.onclick=e=>{e.preventDefault();mode=a.dataset.mode;$('search').value='';$('unit').value='all';history.replaceState(null,'',location.pathname+'?sadala='+mode);render();window.scrollTo(0,0);});$('search').oninput=render;$('unit').onchange=render;$('broader').onchange=render;render();
